[project]
name = "light-harness"
version = "0.1.0"
description = "A lightweight agentic harness for responding to triggers such as webhooks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Neil McGlohon" }]
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
agent = "light_harness.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/light_harness"]

[tool.uv]
# uv resolves the interpreter from .python-version. Dependencies in
# [dependency-groups] (PEP 735) are synced with `uv sync --group dev`.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["light_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
